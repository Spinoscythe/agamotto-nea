spring.application.name=agamotto

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agamotto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

agamotto.jwt.secret=${AGAMOTTO_JWT_SECRET:agamotto-dev-jwt-secret-change-me-32b}
agamotto.jwt.expiration-ms=${AGAMOTTO_JWT_EXPIRATION_MS:86400000}
