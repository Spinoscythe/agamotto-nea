# Spring Boot application name (shown in logs / actuator).
spring.application.name=agamotto

# JDBC connection to MySQL. Override with SPRING_DATASOURCE_* in production.
# Default database name is agamotto on localhost:3306.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agamotto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate owns the schema: update tables/columns (and @Comment text) on startup.
# Never use create-drop in a database that holds real NEA evidence.
spring.jpa.hibernate.ddl-auto=update
# Log SQL to stdout while developing so queries can be checked against the design.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Do not keep the persistence context open for the whole HTTP request.
spring.jpa.open-in-view=false

# HMAC secret for access JWTs. Must be at least 32 bytes. Override in production.
agamotto.jwt.secret=${AGAMOTTO_JWT_SECRET:agamotto-dev-jwt-secret-change-me-32b}
# Access-token lifetime in milliseconds (default 24 hours).
agamotto.jwt.expiration-ms=${AGAMOTTO_JWT_EXPIRATION_MS:86400000}
